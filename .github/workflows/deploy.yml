name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sito statico: nessuna build, si pubblicano solo i file del sito
      # (esclusi Media/, BUILD-PLAN.md e la configurazione locale).
      - name: Prepara i file del sito
        working-directory: Website portfolio
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp -r index.html lavori.html listino.html contatti.html admin.html style.css script.js admin.css admin.js assets "$GITHUB_WORKSPACE/_site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
